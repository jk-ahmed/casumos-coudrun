# Cloud Build pipeline — cached incremental deployments for Causmos
#
# Replaces: gcloud run deploy causmos-service --source . --region asia-south1
#
# Manual submit:
#   gcloud builds submit --config cloudbuild.yaml . --project=acceleration-ga-poc
#
# Or wire to a Cloud Build Trigger in GCP Console for automatic deploys on push.

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: causmos-service
  _REPO: cloud-run-source-deploy

steps:
  # Resolve image tag:
  #   - Trigger build: COMMIT_SHA is set automatically (git SHA of the commit)
  #   - Manual submit: COMMIT_SHA is empty, falls back to BUILD_ID (unique per build)
  - name: 'gcr.io/cloud-builders/docker'
    id: set-tag
    entrypoint: bash
    args:
      - '-c'
      - |
        TAG="${COMMIT_SHA:-$BUILD_ID}"
        printf '%s' "$TAG" > /workspace/_tag
        echo "Image tag: $TAG"

  # Pull previous image to prime Docker's layer cache.
  # Runs in parallel with set-tag (waitFor: ['-'] = start immediately).
  - name: 'gcr.io/cloud-builders/docker'
    id: pull-cache
    waitFor: ['-']
    entrypoint: bash
    args:
      - '-c'
      - |
        docker pull \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest \
          || true

  # Build — when requirements.txt is unchanged, the pip-install layer
  # (TensorFlow, TFP, all Google libs) is reused from cache, saving ~12 min.
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    waitFor: ['set-tag', 'pull-cache']
    entrypoint: bash
    args:
      - '-c'
      - |
        TAG=$(cat /workspace/_tag)
        docker build \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$TAG \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest \
          .

  # Push unique tag — immutable reference for rollbacks.
  - name: 'gcr.io/cloud-builders/docker'
    id: push-tag
    waitFor: ['build']
    entrypoint: bash
    args:
      - '-c'
      - |
        TAG=$(cat /workspace/_tag)
        docker push \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$TAG

  # Push latest tag — used as --cache-from on the next build.
  - name: 'gcr.io/cloud-builders/docker'
    id: push-latest
    waitFor: ['build']
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'

  # Deploy pre-built image to Cloud Run.
  # --image preserves all existing service config: memory, CPU, env vars,
  # secrets, service account, min/max instances, timeout, etc.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push-tag', 'push-latest']
    entrypoint: bash
    args:
      - '-c'
      - |
        TAG=$(cat /workspace/_tag)
        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$TAG \
          --region=${_REGION} \
          --quiet

options:
  # machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
