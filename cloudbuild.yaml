# Cloud Build pipeline — cached incremental deployments for Causmos
#
# Replaces "gcloud run deploy --source ." for day-to-day deploys.
# The first-time setup (IAM, Firestore, AR repo) is still handled by install_cloudrun.sh.
#
# Trigger manually:
#   gcloud builds submit --config cloudbuild.yaml .
#
# Or connect to a Cloud Build Trigger in the GCP Console.

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: causmos-service
  _REPO: app-images

steps:
  # Pull the previous image to prime Docker's layer cache.
  # The "|| true" ensures the build proceeds even on a first run (no image yet).
  - name: 'gcr.io/cloud-builders/docker'
    id: pull-cache
    entrypoint: bash
    args:
      - '-c'
      - >-
        docker pull
        ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest
        || true

  # Build using cached layers. When requirements.txt is unchanged, the
  # pip-install layer is reused from the pulled image — skipping the heavy
  # TensorFlow/Google-Cloud dependency installation.
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    waitFor: ['pull-cache']
    args:
      - build
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # Push the immutable commit-SHA tag (used for rollbacks).
  - name: 'gcr.io/cloud-builders/docker'
    id: push-sha
    waitFor: ['build']
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'

  # Push the mutable latest tag (used as --cache-from on the next build).
  - name: 'gcr.io/cloud-builders/docker'
    id: push-latest
    waitFor: ['build']
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'

  # Deploy the pre-built image to Cloud Run.
  # Using --image instead of --source preserves all existing service config:
  # memory, CPU, env vars, secrets, service account, min/max instances, etc.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push-sha', 'push-latest']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--quiet'

# Registers both tags as build outputs in Cloud Build history.
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'

options:
  # 8-core machine cuts the TensorFlow compilation/linking time significantly.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# 30-minute ceiling — first cold build with TF takes ~15 min; cached builds ~3 min.
timeout: 1800s
